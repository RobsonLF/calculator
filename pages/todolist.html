<body>
    <div class="app-shell" >
        <aside class="sidebar">
            <div class="brand">
                <i class="bi bi-flower1"></i>    
                <span>TOOLS</span>
            </div>
            <div class="sidebar-rule sidebar-rule-line"></div>
            <nav class="sidebar-nav" arial-label="Navegação principal">
                <a class="nav-item" href="../index.html"><i class="bi bi-calculator"></i><span>Calclib</span></a>
                <a class="nav-item active" href="todolist.html"><i class="bi bi-list-task"></i><span>ToDo List</span></a>

        </aside>
        <main class="main-content" id="todolist">
            <header class="topbar">
                <h1>ToDo List</h1>
                <div class="topbar-actions">
                    <button type="button" aria-label="Perfil"><i class="bi bi-person-circle"></i></button>
                </div>
            </header>
            <section class="section-content" aria-label="ToDo List">
                <div class="container">
                    <div class="row">
                        <div class="col align-self-center main">
                        <h1>To Do List</h1>
                        <form class="row g-3 justify-content-center mx-auto" style="max-width: 520px;">
                            <div class="col-8 input-group form-input">
                            <span class="input-group-text" id="basic-addon1">Task</span>
                            <input type="text" class="form-control" id="input-tarefa" placeholder="Task Description" aria-label="Username" aria-describedby="basic-addon1">
                            <button type="button" class="btn btn-outline-secondary" id="btn-tarefa">Adicionar</button>
                            <!--<button type="button" class="btn-outline theme-inverse">Adicionar</button>-->
                            </div>  
                        </form>
                            <p>
                                <ul class="list-group justify-content-center mx-auto w-75 tarefas">

                                </ul>
                            </p>
                        </div>
                    </div>
                </div>
            </section>
            
        </main>
