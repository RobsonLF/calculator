<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tools</title>
    <!--Links-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="icon" href="./img/flower1.svg" type="image/x-icon">
    <link rel="stylesheet" href="./styles/style1.css">
    <!--Links-->
</head>
<!--Referência para o conversor de medidas-->
<!--https://conversordemedidas.com.br/#/conversor-de-medidas-->
<body>
    <div class="app-shell" >
        <aside class="sidebar">
            <div class="brand">
                <i class="bi bi-flower1"></i>    
                <span>TOOLS</span>
            </div>
            <div class="sidebar-rule sidebar-rule-line"></div>
            <nav class="sidebar-nav" arial-label="Navegação principal">
                <a class="nav-item active" href="./index_v2.html"><i class="bi bi-calculator"></i><span>Calclib</span></a>
                <a class="nav-item" href="./pages/conversor.html"><i class="bi bi-rulers"></i><span>Conversor</span></a>
                <a class="nav-item" href="./pages/sistemanumerico.html"><i class="bi bi-code"></i><span>Sistema Numérico</span></a>
                <a class="nav-item" href="#"><i class="bi bi-map"></i><span>Fuso Horário</span></a>
                <a class="nav-item" href="#"><i class="bi bi-graph-up"></i><span>Análise Combinatória</span></a>
            </nav>
        </aside>
        <main class="main-content" id="calclib">
            <header class="topbar">
                <h1>Calclib</h1>
                <div class="topbar-actions">
                    <button type="button" aria-label="Perfil"><i class="bi bi-person-circle"></i></button>
                </div>
            </header>
            <section class="section-content" aria-label="Calclib">
                <div class="container">
                    <div class="row justify-content-center">
                        <div class="col-11 inputcalc1">
                            <h2 class="titulo2">Dados da Fiada</h2>
                            <form class="row row-cols-sm-auto g-2 align-items-center border border-1 border-secondary-subtle p-2 rounded-1">
                                <div class="input-group input-group-sm mt-0 mb-2 w-50">
                                    <span class="input-group-text">Espessura</span>
                                    <input type="text" class="form-control" aria-label="Esp." id="espessura">
                                    <span class="input-group-text">mm</span>
                                </div>
                                <div class="input-group input-group-sm mt-0 mb-2 w-50">
                                    <span class="input-group-text">Ø Externo</span>
                                    <input type="text" class="form-control" aria-label="Ø Externo" id="diamExt">
                                    <span class="input-group-text">mm</span>
                                </div>
                                <div class="input-group input-group-sm mt-0 mb-2 w-50">
                                    <span class="input-group-text">Ângulo</span>
                                    <input type="text" class="form-control" aria-label="Angulo" id="angulo">
                                    <span class="input-group-text">°</span>
                                </div>
                                <div class="input-group input-group-sm mt-0 mb-2 w-50">
                                    <span class="input-group-text">Junta</span>
                                    <input type="text" class="form-control" aria-label="Junta" id="junta">
                                    <span class="input-group-text">mm</span>
                                </div>

                                <div class="col-11 w-100" id="tabelaDiam">
                                    <table class="table table-striped table-sm mb-5">
                                        <thead class="table-light">
                                            <tr>
                                                <th scope="col">#</th>
                                                <th scope="col">Espessura</th>
                                                <th scope="col">Ø Externo</th>
                                                <th scope="col">Ø Interno</th>
                                                <th scope="col">Ângulo</th>
                                                <th scope="col">Junta</th>
                                            </tr>
                                            <tbody>
                                                <tr>
                                                    
                                                </tr>
                                            </tbody>
                                        </thead>
                                    </table>
                                </div>
                                <button type="button" class="btn btn-outline-primary btn-sm mt-0 mb-1 w-25 mx-auto" id="btnAddDadosFiada" >Adicionar</button>
                                <button type="button" class="btn btn-outline-danger btn-sm mt-0 mb-1 w-25 mx-auto" id="btnLimparDadosFiada" >Limpar</button>
                            </form>
                        </div>
                    </div>
                    <div class="row justify-content-center">
                        <div class="col-11 inputcalc1">
                            <h2 class="titulo2">Dados do Tijolo</h2>
                            <form class="row row-cols-sm-auto g-2 align-items-center border border-1 border-secondary-subtle p-2 rounded-1">
                                <div class="input-group input-group-sm mt-0 mb-2 w-50">
                                    <span class="input-group-text">Corda Ext.</span>
                                    <input type="text" class="form-control" aria-label="Corda Externa" id="cordaExterna">
                                    <span class="input-group-text">mm</span>
                                </div>
                                <div class="input-group input-group-sm mt-0 mb-2 w-50">
                                    <span class="input-group-text">Corda Int.</span>
                                    <input type="text" class="form-control" aria-label="Corda Interna" id="cordaInterna">
                                    <span class="input-group-text">mm</span>
                                </div>
                                <button type="button" class="btn btn-outline-primary btn-sm mt-0 mb-1 w-25 mx-auto" id="btnAddTijolos" >Adicionar</button>
                                <button type="button" class="btn btn-outline-danger btn-sm mt-0 mb-1 w-25 mx-auto" id="btnLimparTijolos" >Limpar</button>
                            </form>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="./js/scripts1.js"></script>
</body>
</html>
